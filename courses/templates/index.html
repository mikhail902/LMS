{% extends 'base.html' %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">
                            {{ product.description|truncatechars:100 }}
                        </p>
                        <p class="card-text fw-bold">
                            {{ product.price }}₽
                        </p>
                        <a class="btn btn-primary" href="{% url 'main:single_product' product.pk %}" role="button">Смотреть</a>
                        {% if user.is_authenticated and user == product.owner %}
                        <button type="button" class="btn btn-secondary">Изменить</button>
                        <a class="btn btn-danger" href="{% url 'main:delete_product' product.pk %}" role="button">Удалить</a>
                        {% endif %}
                        <div class="d-flex justify-content-between align-items-center">
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
